name: 'Shielded.dev Badge Action'
description: 'Update a badge on Shielded.dev - the free README badge hosting service.'
inputs:
  shielded-token:
    description: 'Shielded.dev API token. If omitted, the action uses SHIELDED_TOKEN from the environment.'
  shielded-key:
    description: 'Optional shield key'
  title:
    description: 'Badge title'
  color:
    description: 'Badge color'
  text:
    description: 'Badge text'
  endpoint:
    description: 'Custom Shielded API endpoint'
outputs:
  shield-url:
    description: 'Public URL of the updated shield'
runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: "toggle-left"
  color: "orange"
